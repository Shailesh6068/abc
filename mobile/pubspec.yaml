name: racezone
description: Real-Time GPS Racing Application for Android & iOS (Running, Cycling, Motorbike)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Routing & Deep Linking
  go_router: ^13.2.0
  
  # Backend & Realtime
  supabase_flutter: ^2.3.4
  
  # Location & Sensors
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # Maps
  google_maps_flutter: ^2.6.0
  
  # Advertising (Google AdMob official SDK)
  google_mobile_ads: ^5.1.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10+1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
